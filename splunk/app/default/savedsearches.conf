[LLM Guardrail - Prompt Injection Attempt]
description = LLM01: high injection score. RBA: +40 risk to user_id and app_id.
search = index=llm_events sourcetype=llm:guardrail:decision input_scores.injection>0.8 | stats count by user_id, app_id, policy_id
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4

[LLM Guardrail - Possible Jailbreak Success]
description = Flagged input was allowed and output looks sensitive/leaky.
search = index=llm_events decision=ALLOW input_scores.injection>0.6 | where output_scores.leakage>0.7 OR output_scores.pii_count>0 | stats count by user_id, app_id, trace_id
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 5

[LLM Guardrail - PII Exfiltration]
description = LLM02: repeated PII in model output for one user.
search = index=llm_events output_scores.pii_count>0 | stats sum(output_scores.pii_count) as leaks by user_id | where leaks>3
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 4

[LLM Guardrail - Token Cost Anomaly]
description = LLM10: per-user token burn > mean + 3 stdev in an hour.
search = index=llm_events | bucket _time span=1h | stats sum(tokens_in) as tokens_in sum(tokens_out) as tokens_out by user_id, _time | eval tokens=tokens_in+tokens_out | eventstats avg(tokens) as avg stdev(tokens) as sd by user_id | where tokens > avg + 3*sd
cron_schedule = 0 * * * *
enableSched = 1
alert.severity = 3

[LLM Guardrail - System Prompt Probing]
description = LLM07: >=5 distinct probing prompts from one user in 5 minutes.
search = index=llm_events (policy_id=injection_high OR policy_id=injection_warn OR "system prompt") | bucket _time span=5m | stats dc(prompt_hash) as attempts by user_id, _time | where attempts>=5
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4
